<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devilish Scripts — Admin</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #0a0318, #160830, #0d0520);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #e0d0f0;
  }
  .card {
    background: linear-gradient(145deg, #120628, #1e0a3c);
    border: 1px solid #6920a0;
    border-radius: 12px;
    padding: 32px;
    width: 440px;
    max-width: 95vw;
    box-shadow: 0 0 40px rgba(105, 32, 160, 0.25);
  }
  h1 {
    text-align: center; font-size: 20px; margin-bottom: 4px;
    background: linear-gradient(90deg, #c080ff, #ff60a0);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .subtitle { text-align: center; font-size: 12px; color: #9070b0; margin-bottom: 20px; }
  label { display: block; font-size: 12px; color: #a080c0; margin-bottom: 4px; }
  input, select {
    width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid #4a1878;
    background: #0d0420; color: #d0b0ff; font-size: 14px; font-family: inherit;
    margin-bottom: 14px; outline: none;
  }
  input:focus, select:focus { border-color: #8040d0; }
  input::placeholder { color: #604080; }
  select option { background: #0d0420; color: #d0b0ff; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  .btn {
    display: block; width: 100%; padding: 11px; border: none; border-radius: 6px;
    font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s;
    margin-bottom: 10px;
  }
  .btn:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.15); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-create { background: linear-gradient(135deg, #5a15a0, #8020d0); color: #fff; }
  .btn-copy { background: linear-gradient(135deg, #1a6030, #20a048); color: #fff; font-size: 12px; padding: 8px; }
  .btn-revoke { background: linear-gradient(135deg, #801020, #c02040); color: #fff; font-size: 12px; padding: 8px; }
  hr { border: none; border-top: 1px solid #301060; margin: 18px 0; }
  .section-label { font-size: 11px; color: #7060a0; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
  .status {
    text-align: center; font-size: 12px; padding: 8px; border-radius: 6px;
    margin-top: 8px; min-height: 32px; word-break: break-all;
  }
  .status.idle { background: #1a0a30; color: #7060a0; }
  .status.ok { background: #0a200a; color: #60d060; }
  .status.err { background: #200a0a; color: #d06060; }
  .status.info { background: #1a1a00; color: #d0d060; }
  .result-key {
    background: #0d0420; border: 1px solid #20a040; border-radius: 6px;
    padding: 12px; text-align: center; font-family: 'Cascadia Code', 'Fira Code', monospace;
    font-size: 16px; color: #80ff80; letter-spacing: 1px; margin: 10px 0;
    word-break: break-all; display: none;
  }
  .log {
    background: #08020f; border: 1px solid #301060; border-radius: 6px;
    padding: 10px; font-size: 11px; font-family: 'Cascadia Code', monospace;
    color: #9080b0; max-height: 160px; overflow-y: auto; margin-top: 12px;
    line-height: 1.6; display: none;
  }
  .log .entry { border-bottom: 1px solid #1a0830; padding: 2px 0; }
  .log .entry:last-child { border-bottom: none; }
  .log .key-val { color: #80ff80; }
  .log .time-val { color: #a0a0a0; }
</style>
</head>
<body>

<div class="card">
  <h1>Devilish Scripts</h1>
  <div class="subtitle">Admin Panel</div>

  <label>Worker URL</label>
  <input type="text" id="workerUrl" placeholder="https://devilish-keys.xxx.workers.dev">

  <label>Admin Secret</label>
  <input type="password" id="adminSecret" placeholder="Your ADMIN_SECRET">

  <hr>
  <div class="section-label">Create Key</div>

  <div class="row">
    <div>
      <label>Duration (hours)</label>
      <select id="hours">
        <option value="6">6 hours</option>
        <option value="12" selected>12 hours</option>
        <option value="24">24 hours</option>
        <option value="48">48 hours</option>
        <option value="72">72 hours</option>
        <option value="168">7 days</option>
        <option value="720">30 days</option>
        <option value="custom">Custom...</option>
      </select>
    </div>
    <div>
      <label>Lock to UserId (optional)</label>
      <input type="text" id="lockUserId" placeholder="Leave empty = unbound" style="margin-bottom:0">
    </div>
  </div>

  <input type="number" id="customHours" placeholder="Custom hours" style="display:none; margin-top:10px">

  <button class="btn btn-create" id="btnCreate">Create Key</button>

  <div class="result-key" id="resultKey"></div>
  <button class="btn btn-copy" id="btnCopy" style="display:none">Copy Key</button>

  <hr>
  <div class="section-label">Validate / Lookup Key</div>

  <div class="row">
    <div style="flex:2">
      <input type="text" id="lookupKey" placeholder="DVLS-XXXX-XXXX-XXXX-XXXX" style="margin-bottom:0">
    </div>
    <div style="flex:1">
      <input type="text" id="lookupUserId" placeholder="UserId" style="margin-bottom:0">
    </div>
  </div>
  <div class="row" style="margin-top:10px">
    <button class="btn btn-copy" id="btnValidate" style="flex:1;background:linear-gradient(135deg,#0a4080,#1070d0)">Validate</button>
  </div>

  <div class="status idle" id="status">Ready</div>

  <div class="log" id="log"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let lastKey = "";

// Persist worker URL + secret in sessionStorage
const saved = sessionStorage.getItem("dv_admin");
if (saved) {
  try {
    const s = JSON.parse(saved);
    if (s.url) $("workerUrl").value = s.url;
    if (s.sec) $("adminSecret").value = s.sec;
  } catch (_) {}
}
function persist() {
  sessionStorage.setItem("dv_admin", JSON.stringify({
    url: $("workerUrl").value.trim(),
    sec: $("adminSecret").value.trim()
  }));
}
$("workerUrl").addEventListener("change", persist);
$("adminSecret").addEventListener("change", persist);

$("hours").addEventListener("change", function () {
  $("customHours").style.display = this.value === "custom" ? "block" : "none";
});

function setStatus(msg, cls) {
  $("status").textContent = msg;
  $("status").className = "status " + cls;
}

function addLog(html) {
  const log = $("log");
  log.style.display = "block";
  const d = document.createElement("div");
  d.className = "entry";
  d.innerHTML = html;
  log.prepend(d);
  if (log.children.length > 50) log.lastChild.remove();
}

function fmtDate(ts) {
  return new Date(ts * 1000).toLocaleString();
}

function getConfig() {
  const url = $("workerUrl").value.trim().replace(/\/+$/, "");
  const secret = $("adminSecret").value.trim();
  if (!url) { setStatus("Enter Worker URL", "err"); return null; }
  if (!secret) { setStatus("Enter Admin Secret", "err"); return null; }
  return { url, secret };
}

// ── Create Key ──
$("btnCreate").addEventListener("click", async () => {
  const cfg = getConfig();
  if (!cfg) return;

  let hours = parseInt($("hours").value);
  if ($("hours").value === "custom") hours = parseInt($("customHours").value);
  if (!hours || hours < 1) { setStatus("Invalid duration", "err"); return; }

  const uid = $("lockUserId").value.trim() || null;
  setStatus("Creating key...", "info");

  try {
    const body = { hours };
    if (uid) body.userId = uid;

    const res = await fetch(cfg.url + "/api/admin/create", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Admin-Key": cfg.secret },
      body: JSON.stringify(body),
    });
    const data = await res.json();

    if (res.status === 401) { setStatus("Unauthorized — wrong admin secret", "err"); return; }
    if (data.error) { setStatus("Error: " + data.error, "err"); return; }

    lastKey = data.key;
    $("resultKey").textContent = data.key;
    $("resultKey").style.display = "block";
    $("btnCopy").style.display = "block";
    setStatus("Key created!", "ok");

    addLog(
      `<span class="key-val">${data.key}</span> ` +
      `${hours}h` +
      (uid ? ` locked:${uid}` : " unbound") +
      ` <span class="time-val">exp ${fmtDate(data.expiresAt)}</span>`
    );
  } catch (err) {
    setStatus("Network error: " + err.message, "err");
  }
});

// ── Copy ──
$("btnCopy").addEventListener("click", () => {
  if (!lastKey) return;
  navigator.clipboard.writeText(lastKey).then(
    () => setStatus("Copied!", "ok"),
    () => setStatus("Copy failed", "err")
  );
});

// ── Validate ──
$("btnValidate").addEventListener("click", async () => {
  const cfg = getConfig();
  if (!cfg) return;

  const key = $("lookupKey").value.trim();
  const uid = $("lookupUserId").value.trim();
  if (!key) { setStatus("Enter a key to validate", "err"); return; }
  if (!uid) { setStatus("Enter a userId to validate against", "err"); return; }

  setStatus("Validating...", "info");

  try {
    const res = await fetch(cfg.url + "/api/validate?key=" + encodeURIComponent(key) + "&userId=" + encodeURIComponent(uid));
    const data = await res.json();

    if (data.valid) {
      const rem = data.remaining;
      const h = Math.floor(rem / 3600);
      const m = Math.floor((rem % 3600) / 60);
      setStatus(`Valid — ${h}h ${m}m remaining — expires ${fmtDate(data.expiresAt)}`, "ok");
      addLog(`<span class="key-val">${key}</span> VALID for ${uid} <span class="time-val">${h}h${m}m left</span>`);
    } else {
      setStatus("Invalid: " + (data.error || "unknown"), "err");
      addLog(`<span class="key-val">${key}</span> INVALID: ${data.error}`);
    }
  } catch (err) {
    setStatus("Network error: " + err.message, "err");
  }
});
</script>
</body>
</html>
