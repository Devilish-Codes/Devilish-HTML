<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devilish Scripts — Key System</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #0a0318, #160830, #0d0520);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #e0d0f0;
  }
  .card {
    background: linear-gradient(145deg, #120628, #1e0a3c);
    border: 1px solid #6920a0;
    border-radius: 12px;
    padding: 32px;
    width: 420px;
    max-width: 95vw;
    box-shadow: 0 0 40px rgba(105, 32, 160, 0.25);
  }
  h1 {
    text-align: center;
    font-size: 20px;
    margin-bottom: 6px;
    background: linear-gradient(90deg, #c080ff, #ff60a0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle {
    text-align: center;
    font-size: 12px;
    color: #9070b0;
    margin-bottom: 24px;
  }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 12px; color: #a080c0; margin-bottom: 4px; }
  .key-display {
    background: #0d0420;
    border: 1px solid #4a1878;
    border-radius: 6px;
    padding: 12px 16px;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    font-size: 18px;
    text-align: center;
    letter-spacing: 1px;
    color: #d0b0ff;
    word-break: break-all;
    min-height: 48px;
    display: flex; align-items: center; justify-content: center;
  }
  .key-display.has-key { color: #80ff80; border-color: #20a040; }
  .btn {
    display: block;
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    margin-bottom: 8px;
  }
  .btn:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.15); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-copy {
    background: linear-gradient(135deg, #5a15a0, #8020d0);
    color: #fff;
  }
  .btn-lootlabs {
    background: linear-gradient(135deg, #1a6030, #20a048);
    color: #fff;
  }
  .btn-linkvertise {
    background: linear-gradient(135deg, #0a4080, #1070d0);
    color: #fff;
  }
  .btn-extend {
    background: linear-gradient(135deg, #6a4000, #b08020);
    color: #fff;
    font-size: 12px;
    padding: 8px;
  }
  .status {
    text-align: center;
    font-size: 12px;
    padding: 8px;
    border-radius: 6px;
    margin-top: 12px;
    min-height: 32px;
  }
  .status.waiting { background: #1a0a30; color: #a080c0; }
  .status.polling { background: #1a1a00; color: #d0d060; }
  .status.success { background: #0a200a; color: #60d060; }
  .status.error   { background: #200a0a; color: #d06060; }
  .expires {
    text-align: center;
    font-size: 11px;
    color: #7060a0;
    margin-top: 8px;
  }
  hr {
    border: none;
    border-top: 1px solid #301060;
    margin: 16px 0;
  }
  .section-label {
    font-size: 11px;
    color: #7060a0;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .extend-row { display: flex; gap: 8px; }
  .extend-row .btn { flex: 1; }

  /* Checkpoint progress */
  .progress-wrap {
    background: #0d0420;
    border: 1px solid #301060;
    border-radius: 8px;
    height: 28px;
    margin-bottom: 16px;
    overflow: hidden;
    position: relative;
  }
  .progress-bar {
    height: 100%;
    border-radius: 7px;
    transition: width 0.6s ease;
    background: linear-gradient(90deg, #5a15a0, #20a048);
  }
  .progress-text {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }
  .checkpoint-msg {
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 16px;
    padding: 12px;
    border-radius: 8px;
  }
  .checkpoint-msg.partial {
    background: #1a1a00;
    border: 1px solid #6a6a00;
    color: #e0d060;
  }
  .checkpoint-msg.done {
    background: #0a200a;
    border: 1px solid #20a040;
    color: #60e060;
  }
  #cp2Section { display: none; }
</style>
</head>
<body>

<div class="card">
  <h1>Devilish Scripts</h1>
  <div class="subtitle">Key System</div>

  <div class="field">
    <label>Your Key</label>
    <div class="key-display" id="keyDisplay">—</div>
  </div>

  <button class="btn btn-copy" id="btnCopy" disabled>Copy Key</button>

  <!-- Checkpoint progress (hidden until checkpoint flow starts) -->
  <div id="cpProgress" style="display:none">
    <hr>
    <div class="progress-wrap">
      <div class="progress-bar" id="cpBar" style="width:0%"></div>
      <div class="progress-text" id="cpBarText">Checkpoint 0/2</div>
    </div>
    <div class="checkpoint-msg partial" id="cpMsg" style="display:none"></div>
  </div>

  <!-- Checkpoint 2 buttons (shown after checkpoint 1) -->
  <div id="cp2Section">
    <div class="section-label">Complete Checkpoint 2</div>
    <button class="btn btn-lootlabs" id="btnCp2Loot">Continue via Loot Labs</button>
    <button class="btn btn-linkvertise" id="btnCp2Link">Continue via Linkvertise</button>
  </div>

  <!-- Initial get key buttons -->
  <div id="getKeySection">
    <hr>
    <div class="section-label">Get a New Key</div>
    <button class="btn btn-lootlabs" id="btnLootlabs">Get Key via Loot Labs</button>
    <button class="btn btn-linkvertise" id="btnLinkvertise">Get Key via Linkvertise</button>
  </div>

  <div id="extendSection">
    <hr>
    <div class="section-label">Extend Existing Key (+6 hours)</div>
    <div class="extend-row">
      <button class="btn btn-extend" id="btnExtLoot" disabled>Loot Labs</button>
      <button class="btn btn-extend" id="btnExtLink" disabled>Linkvertise</button>
    </div>
  </div>

  <div class="status waiting" id="status">Waiting...</div>
  <div class="expires" id="expires"></div>
</div>

<script>
const WORKER = "https://devilish-keys.devilish-codes.workers.dev";

const LOOTLABS_URL = "https://lootdest.org/s?FvzGY6FE";
const LINKVERTISE_URL = "https://link-hub.net/2037098/Gt1GKVp0MwNt";

const params = new URLSearchParams(location.search);
const userId = params.get("userId") || "";
const service = params.get("service") || "";
const isExtend = params.get("extend") === "1";
const extendKey = params.get("key") || "";
const isCompleted = params.get("completed") === "1";

const $ = (id) => document.getElementById(id);
let currentKey = extendKey || "";
let currentSession = null;
let pollTimer = null;

function setStatus(msg, cls) {
  const el = $("status");
  el.textContent = msg;
  el.className = "status " + cls;
}

function showKey(key, expiresAt) {
  currentKey = key;
  const d = $("keyDisplay");
  d.textContent = key;
  d.classList.add("has-key");
  $("btnCopy").disabled = false;
  $("btnExtLoot").disabled = false;
  $("btnExtLink").disabled = false;
  $("getKeySection").style.display = "none";
  $("cp2Section").style.display = "none";
  if (expiresAt) {
    const dt = new Date(expiresAt * 1000);
    $("expires").textContent = "Expires: " + dt.toLocaleString();
  }
}

function updateProgress(count) {
  $("cpProgress").style.display = "block";
  const pct = (count / 2) * 100;
  $("cpBar").style.width = pct + "%";
  $("cpBarText").textContent = "Checkpoint " + count + "/2";
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(
    () => setStatus("Copied to clipboard!", "success"),
    () => {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
      setStatus("Copied to clipboard!", "success");
    }
  );
}

function getCheckpointUrl(svc) {
  if (svc === "lootlabs") return LOOTLABS_URL;
  return LINKVERTISE_URL;
}

async function startSession(svc, extend = false) {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  setStatus("Creating session...", "polling");

  try {
    const body = extend
      ? { userId, service: svc, extend: true, keyToExtend: currentKey }
      : { userId, service: svc };

    const res = await fetch(WORKER + "/api/session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json();

    if (data.existingKey) {
      showKey(data.existingKey, data.expiresAt);
      setStatus("You already have a valid key!", "success");
      return;
    }

    if (!data.session || !data.checkpointUrl) {
      setStatus("Error: " + (data.error || "unknown"), "error");
      return;
    }

    currentSession = data.session;
    try {
      localStorage.setItem("dvls_session", data.session);
      localStorage.setItem("dvls_checkpoint", "0");
    } catch (_) {}

    if (extend) {
      // Extend = single checkpoint, no dual gate
      window.open(data.checkpointUrl, "_blank");
      setStatus("Complete the checkpoint in the new tab, then wait...", "polling");
      pollTimer = setInterval(async () => {
        try {
          const pr = await fetch(WORKER + "/api/poll?session=" + currentSession);
          const pd = await pr.json();
          if (pd.completed && pd.key) {
            clearInterval(pollTimer);
            pollTimer = null;
            showKey(pd.key);
            setStatus("Key extended! +6 hours", "success");
            try {
              const vr = await fetch(WORKER + "/api/validate?key=" + pd.key + "&userId=" + userId);
              const vd = await vr.json();
              if (vd.expiresAt) $("expires").textContent = "Expires: " + new Date(vd.expiresAt * 1000).toLocaleString();
            } catch (_) {}
          }
        } catch (_) {}
      }, 3000);
    } else {
      // New key = dual checkpoint
      updateProgress(0);
      $("getKeySection").style.display = "none";
      window.location.href = data.checkpointUrl;
    }
  } catch (err) {
    setStatus("Network error: " + err.message, "error");
  }
}

function startCheckpoint2(svc) {
  try { localStorage.setItem("dvls_checkpoint", "1"); } catch (_) {}
  window.location.href = getCheckpointUrl(svc);
}

async function completeSession(sess) {
  setStatus("Generating key...", "polling");
  try {
    const r = await fetch(WORKER + "/api/postback?session=" + sess);
    const d = await r.json();
    if (d.ok && d.key) {
      try {
        localStorage.removeItem("dvls_session");
        localStorage.removeItem("dvls_checkpoint");
      } catch (_) {}
      updateProgress(2);
      const msg = $("cpMsg");
      msg.style.display = "block";
      msg.className = "checkpoint-msg done";
      msg.textContent = "Checkpoint 2/2 Completed!";
      showKey(d.key, d.expiresAt);
      setStatus("Key obtained! Copy it and paste in-game.", "success");
    } else {
      setStatus("Error: " + (d.error || "session not found"), "error");
    }
  } catch (e) {
    setStatus("Network error: " + e.message, "error");
  }
}

// ── Button handlers ──
$("btnCopy").addEventListener("click", () => { if (currentKey) copyToClipboard(currentKey); });

$("btnLootlabs").addEventListener("click", () => startSession("lootlabs"));
$("btnLinkvertise").addEventListener("click", () => startSession("linkvertise"));

$("btnExtLoot").addEventListener("click", () => startSession("lootlabs", true));
$("btnExtLink").addEventListener("click", () => startSession("linkvertise", true));

$("btnCp2Loot").addEventListener("click", () => startCheckpoint2("lootlabs"));
$("btnCp2Link").addEventListener("click", () => startCheckpoint2("linkvertise"));

// ── Handle checkpoint returns ──
if (isCompleted) {
  (async () => {
    let sess = null;
    let cp = 0;
    try {
      sess = localStorage.getItem("dvls_session");
      cp = parseInt(localStorage.getItem("dvls_checkpoint") || "0");
    } catch (_) {}

    if (!sess) {
      setStatus("No active session found. Try again from in-game.", "error");
      return;
    }

    if (cp < 1) {
      // Checkpoint 1 done
      try { localStorage.setItem("dvls_checkpoint", "1"); } catch (_) {}
      updateProgress(1);
      const msg = $("cpMsg");
      msg.style.display = "block";
      msg.className = "checkpoint-msg partial";
      msg.textContent = "Checkpoint 1/2 Completed!";
      $("getKeySection").style.display = "none";
      $("cp2Section").style.display = "block";
      setStatus("Complete one more checkpoint to get your key.", "polling");
    } else {
      // Checkpoint 2 done
      updateProgress(2);
      $("getKeySection").style.display = "none";
      $("cp2Section").style.display = "none";
      await completeSession(sess);
    }
  })();
} else if (userId && service && !isExtend) {
  startSession(service);
} else if (userId && service && isExtend && extendKey) {
  showKey(extendKey);
  startSession(service, true);
} else if (!userId) {
  setStatus("Missing userId parameter. Launch from in-game.", "error");
}
</script>
</body>
</html>
