<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devilish Scripts — Key System</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #0a0318, #160830, #0d0520);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #e0d0f0;
  }
  .card {
    background: linear-gradient(145deg, #120628, #1e0a3c);
    border: 1px solid #6920a0;
    border-radius: 12px;
    padding: 32px;
    width: 420px;
    max-width: 95vw;
    box-shadow: 0 0 40px rgba(105, 32, 160, 0.25);
  }
  h1 {
    text-align: center;
    font-size: 20px;
    margin-bottom: 6px;
    background: linear-gradient(90deg, #c080ff, #ff60a0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle {
    text-align: center;
    font-size: 12px;
    color: #9070b0;
    margin-bottom: 24px;
  }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 12px; color: #a080c0; margin-bottom: 4px; }
  .key-display {
    background: #0d0420;
    border: 1px solid #4a1878;
    border-radius: 6px;
    padding: 12px 16px;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    font-size: 18px;
    text-align: center;
    letter-spacing: 1px;
    color: #d0b0ff;
    word-break: break-all;
    min-height: 48px;
    display: flex; align-items: center; justify-content: center;
  }
  .key-display.has-key { color: #80ff80; border-color: #20a040; }
  .btn {
    display: block;
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    margin-bottom: 8px;
  }
  .btn:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.15); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-copy {
    background: linear-gradient(135deg, #5a15a0, #8020d0);
    color: #fff;
  }
  .btn-lootlabs {
    background: linear-gradient(135deg, #1a6030, #20a048);
    color: #fff;
  }
  .btn-linkvertise {
    background: linear-gradient(135deg, #0a4080, #1070d0);
    color: #fff;
  }
  .btn-extend {
    background: linear-gradient(135deg, #6a4000, #b08020);
    color: #fff;
    font-size: 12px;
    padding: 8px;
  }
  .status {
    text-align: center;
    font-size: 12px;
    padding: 8px;
    border-radius: 6px;
    margin-top: 12px;
    min-height: 32px;
  }
  .status.waiting { background: #1a0a30; color: #a080c0; }
  .status.polling { background: #1a1a00; color: #d0d060; }
  .status.success { background: #0a200a; color: #60d060; }
  .status.error   { background: #200a0a; color: #d06060; }
  .expires {
    text-align: center;
    font-size: 11px;
    color: #7060a0;
    margin-top: 8px;
  }
  hr {
    border: none;
    border-top: 1px solid #301060;
    margin: 16px 0;
  }
  .section-label {
    font-size: 11px;
    color: #7060a0;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .extend-row { display: flex; gap: 8px; }
  .extend-row .btn { flex: 1; }
</style>
</head>
<body>

<div class="card">
  <h1>Devilish Scripts</h1>
  <div class="subtitle">Key System</div>

  <div class="field">
    <label>Your Key</label>
    <div class="key-display" id="keyDisplay">—</div>
  </div>

  <button class="btn btn-copy" id="btnCopy" disabled>Copy Key</button>

  <hr>
  <div class="section-label">Get a New Key</div>

  <button class="btn btn-lootlabs" id="btnLootlabs">Get Key via Loot Labs</button>
  <button class="btn btn-linkvertise" id="btnLinkvertise">Get Key via Linkvertise</button>

  <hr>
  <div class="section-label">Extend Existing Key (+6 hours)</div>

  <div class="extend-row">
    <button class="btn btn-extend" id="btnExtLoot" disabled>Loot Labs</button>
    <button class="btn btn-extend" id="btnExtLink" disabled>Linkvertise</button>
  </div>

  <div class="status waiting" id="status">Waiting...</div>
  <div class="expires" id="expires"></div>
</div>

<script>
// ── PLACEHOLDER: Replace with your deployed Cloudflare Worker URL ──
const WORKER = "PLACEHOLDER_WORKER_URL";

const params = new URLSearchParams(location.search);
const userId = params.get("userId") || "";
const service = params.get("service") || "";
const isExtend = params.get("extend") === "1";
const extendKey = params.get("key") || "";

const $ = (id) => document.getElementById(id);
let currentKey = extendKey || "";
let currentSession = null;
let pollTimer = null;

function setStatus(msg, cls) {
  const el = $("status");
  el.textContent = msg;
  el.className = "status " + cls;
}

function showKey(key, expiresAt) {
  currentKey = key;
  const d = $("keyDisplay");
  d.textContent = key;
  d.classList.add("has-key");
  $("btnCopy").disabled = false;
  $("btnExtLoot").disabled = false;
  $("btnExtLink").disabled = false;
  if (expiresAt) {
    const dt = new Date(expiresAt * 1000);
    $("expires").textContent = "Expires: " + dt.toLocaleString();
  }
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(
    () => setStatus("Copied to clipboard!", "success"),
    () => {
      // Fallback
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
      setStatus("Copied to clipboard!", "success");
    }
  );
}

async function startSession(svc, extend = false) {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  setStatus("Creating session...", "polling");

  try {
    const body = extend
      ? { userId, service: svc, extend: true, keyToExtend: currentKey }
      : { userId, service: svc };

    const res = await fetch(WORKER + "/api/session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json();

    if (data.existingKey) {
      showKey(data.existingKey, data.expiresAt);
      setStatus("You already have a valid key!", "success");
      return;
    }

    if (!data.session || !data.checkpointUrl) {
      setStatus("Error: " + (data.error || "unknown"), "error");
      return;
    }

    currentSession = data.session;
    window.open(data.checkpointUrl, "_blank");
    setStatus("Complete the checkpoint in the new tab, then wait...", "polling");

    pollTimer = setInterval(async () => {
      try {
        const pr = await fetch(WORKER + "/api/poll?session=" + currentSession);
        const pd = await pr.json();
        if (pd.completed && pd.key) {
          clearInterval(pollTimer);
          pollTimer = null;
          showKey(pd.key);
          setStatus(extend ? "Key extended! +6 hours" : "Key obtained!", "success");
          // Fetch full expiry from validate
          try {
            const vr = await fetch(WORKER + "/api/validate?key=" + pd.key + "&userId=" + userId);
            const vd = await vr.json();
            if (vd.expiresAt) {
              const dt = new Date(vd.expiresAt * 1000);
              $("expires").textContent = "Expires: " + dt.toLocaleString();
            }
          } catch (_) {}
        }
      } catch (_) {}
    }, 3000);
  } catch (err) {
    setStatus("Network error: " + err.message, "error");
  }
}

// ── Button handlers ──
$("btnCopy").addEventListener("click", () => { if (currentKey) copyToClipboard(currentKey); });

$("btnLootlabs").addEventListener("click", () => startSession("lootlabs"));
$("btnLinkvertise").addEventListener("click", () => startSession("linkvertise"));

$("btnExtLoot").addEventListener("click", () => startSession("lootlabs", true));
$("btnExtLink").addEventListener("click", () => startSession("linkvertise", true));

// ── Auto-start if parameters present ──
if (userId && service && !isExtend) {
  startSession(service);
} else if (userId && service && isExtend && extendKey) {
  showKey(extendKey);
  startSession(service, true);
} else if (!userId) {
  setStatus("Missing userId parameter. Launch from in-game.", "error");
}
</script>
</body>
</html>
